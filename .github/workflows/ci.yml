name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Unit/integration tests (hermetic, no simulator)
        run: yarn test
